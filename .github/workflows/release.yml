name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Serialize across reruns / manual triggers so two workflow runs never touch
# the same draft release's latest.json concurrently (tauri-action does a
# read-modify-write on the manifest).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      # Serialize jobs so each tauri-action merges its platform entry into the
      # same draft release's latest.json without racing the previous OS.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Vite picks these up at build time and inlines them into the JS bundle.
          # Required so distributed binaries can hit Google's OAuth endpoints.
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Taskette ${{ github.ref_name }}'
          releaseBody: |
            アプリ内設定 > リリースノートから変更点をご覧いただけます。

            ## インストール
            - **macOS**: `.dmg` をダウンロードして開き、Applications フォルダにドラッグ
            - **Windows**: `.exe` (NSIS, 推奨) または `.msi` をダウンロードして実行

            初回起動時、macOS は Gatekeeper、Windows は SmartScreen の警告が出ます (未署名のため)。詳細メニューから実行を許可してください。
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
